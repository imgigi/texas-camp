<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1220"><style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>德州训练营</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* Layout: phone column. Night-casino palette: ink-navy room, emerald felt table, gold chips. Levels are poker chips on a winding path. */
:root{
  color-scheme:dark;
  --bg:#0c1220;--bg2:#141c2e;--bg3:#1c2740;--line:#27334d;--ink:#eef2fb;--mute:#8e9ab4;
  --felt:#0e6a4e;--felt-hi:#18936c;--felt-lo:#084431;--rail:#0a1a2c;
  --gold:#f5c451;--gold-lo:#b8841c;--red:#ff5d62;--green:#2fd08f;--blue:#5b95ff;--violet:#a98bff;
  --face:#fbfaf6;--face-edge:#d8d4c8;--cred:#d0262c;--cblk:#141a26;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Noto Sans SC",sans-serif;
  --num:"Chakra Petch","PingFang SC","Noto Sans SC",sans-serif;
  --body:-apple-system,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 50% -10%,#1d2b4a 0%,transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px}
.top h1{font:400 21px/1.2 var(--display);margin:0;flex:1;min-width:0;letter-spacing:.02em}
.ic{width:38px;height:38px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.badge{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:4px 10px 4px 4px;font:600 13px/1 var(--num);white-space:nowrap}
.badge i{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#3a2700;display:grid;place-items:center;font-style:normal;font-size:12px}
main{display:flex;flex-direction:column;gap:16px}
h2,h3{margin:0}
/* cards */
.cd{--w:46px;width:var(--w);height:calc(var(--w)*1.38);border-radius:calc(var(--w)*.12);background:var(--face);border:1px solid var(--face-edge);box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--num);font-weight:700;color:var(--cblk);user-select:none;flex:none;position:relative}
.cd .r{font-size:calc(var(--w)*.46)}.cd .s{font-size:calc(var(--w)*.42);margin-top:2px}
.cd.red{color:var(--cred)}
.cd.sm{--w:26px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cd.md{--w:36px}
.cd.lg{--w:56px}
.cd.slot{background:rgba(255,255,255,.06);border:1.5px dashed rgba(255,255,255,.22);box-shadow:none}
.cd.back{background:repeating-linear-gradient(45deg,#7d1d2a 0 4px,#9c2635 4px 8px);border:2px solid #f3e6d0}
.cd.dim{opacity:.32}
.cd.x::after{content:"";position:absolute;inset:-3px;background:linear-gradient(45deg,transparent 46%,var(--red) 46% 54%,transparent 54%)}
.row-c{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
/* chips */
.chip{--c:var(--gold);--s:30px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,var(--c) 0 52%,transparent 53%),repeating-conic-gradient(var(--c) 0 22.5deg,#fff 22.5deg 45deg);
  box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(0,0,0,.18);font:700 11px/1 var(--num);color:#1b1300}
.chip.r{--c:var(--red);color:#fff}.chip.g{--c:var(--green);color:#03281a}.chip.b{--c:var(--blue);color:#fff}.chip.v{--c:var(--violet);color:#fff}.chip.k{--c:#3a465f;color:#fff}
.stack{display:flex;flex-direction:column-reverse;align-items:center}
.stack .chip{--s:22px;height:7px;border-radius:50%/50%;margin-top:-2px;background:var(--c);box-shadow:0 1px 0 rgba(0,0,0,.4)}
/* home */
.hero{position:relative;border-radius:20px;padding:22px 18px 18px;overflow:hidden;background:radial-gradient(140% 120% at 85% 0%,var(--felt-hi),var(--felt) 45%,var(--felt-lo));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 12px 30px rgba(0,0,0,.35)}
.hero h2{font:400 36px/1.05 var(--display);letter-spacing:.02em;max-width:60%}
.hero p{margin:8px 0 0;color:#cfe9de;font-size:14px;max-width:58%}
.fan{position:absolute;right:10px;top:16px;width:130px;height:120px}
.fan .cd{position:absolute;--w:54px;left:38px;top:10px;transform-origin:50% 120%}
.prog{margin-top:16px;display:flex;align-items:center;gap:10px;font:600 13px/1 var(--num);color:#e3f3ec}
.prog .tr{flex:1;height:8px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden}
.prog .tr span{display:block;height:100%;background:var(--gold);border-radius:9px}
.cta{margin-top:14px;width:100%;height:50px;border-radius:14px;background:linear-gradient(180deg,#ffd877,var(--gold));color:#3a2700;font:700 16px/1 var(--body);box-shadow:0 4px 0 var(--gold-lo)}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-lo)}
.path{position:relative;margin-top:4px}
.path svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:relative;height:104px;display:flex;align-items:center}
.node .lvl{position:absolute;width:74px;height:74px;top:14px;display:grid;place-items:center;border-radius:50%}
.lvl .chip{--s:74px;font:700 24px/1 var(--num);box-shadow:0 5px 0 rgba(0,0,0,.4)}
.lvl.done .chip{--c:var(--gold);color:#3a2700}
.lvl.cur .chip{--c:var(--green)}
.lvl.todo .chip{--c:#33405a;color:#c8d1e4}
.lvl.cur::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.15);opacity:0}}
.node .lab{position:absolute;top:22px;text-align:left;align-items:flex-start;width:calc(100% - 110px);display:flex;flex-direction:column;gap:2px}
.lab b{font:400 20px/1.15 var(--display);letter-spacing:.02em}
.lab small{color:var(--mute);font-size:13px;line-height:1.35}
.lab .stars{display:flex;gap:3px;margin-top:4px}
.lab .stars span{width:9px;height:9px;border-radius:50%;background:#33405a}
.lab .stars span.on{background:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:16px;padding:14px;text-align:left;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:132px}
.tile b{font:400 22px/1.1 var(--display)}
.tile small{color:var(--mute);font-size:13px;line-height:1.35}
.tile.play{background:radial-gradient(120% 120% at 100% 0%,#3a2a0c,var(--bg2) 60%);border-color:#4a3a18}
/* steps */
.seg{display:flex;gap:4px}
.seg span{flex:1;height:6px;border-radius:6px;background:var(--bg3)}
.seg span.on{background:var(--gold)}.seg span.cur{background:var(--green)}
/* slides */
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 28px);scroll-snap-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.slide .no{font:600 12px/1 var(--num);color:var(--gold);letter-spacing:.08em}
.slide h3{font:400 23px/1.2 var(--display);letter-spacing:.02em;text-wrap:balance}
.slide p{margin:0;color:#c9d2e6;font-size:14.5px}
.viz{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:7px;height:7px;border-radius:9px;background:var(--bg3);transition:width .2s}
.dots span.on{width:20px;background:var(--gold)}
.k{font-family:var(--num);font-weight:700;color:var(--gold)}
.fx{font:700 15px/1.5 var(--num);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.fx em{font-style:normal;color:var(--gold)}
/* viz parts */
.lad{display:grid;grid-template-columns:18px 52px 1fr;gap:6px 8px;align-items:center;font-size:13px}
.lad i{font:700 12px/1 var(--num);color:var(--mute);font-style:normal}
.hb{display:grid;grid-template-columns:58px 1fr 52px;gap:8px;align-items:center;font-size:13px}
.hb .t{height:14px;border-radius:7px;background:var(--bg3);overflow:hidden;display:flex}
.hb .t span{display:block;height:100%}
.hb b{font:700 13px/1 var(--num);text-align:right}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;background:var(--bg3)}
.pill.r{background:rgba(255,93,98,.16);color:var(--red)}.pill.g{background:rgba(47,208,143,.16);color:var(--green)}.pill.y{background:rgba(245,196,81,.16);color:var(--gold)}.pill.b{background:rgba(91,149,255,.16);color:var(--blue)}
.big4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big4>div{background:var(--bg2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.big4 b{font:700 30px/1 var(--num);color:var(--gold)}
.big4 small{color:var(--mute);font-size:12px}
.tree{display:flex;flex-direction:column;gap:8px;font-size:13px}
.tree .n{background:var(--bg2);border-radius:10px;padding:8px 10px;border-left:4px solid var(--c,var(--line))}
.tree .kids{display:flex;flex-direction:column;gap:6px;padding-left:16px;border-left:2px dashed var(--line);margin-left:10px}
.mini{display:grid;grid-template-columns:repeat(13,1fr);gap:1px}
.mini span{aspect-ratio:1;background:var(--bg3);border-radius:2px}
.mini span.in{background:var(--red)}.mini span.in2{background:var(--green)}
/* chart */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border-radius:99px;padding:5px 12px;font:700 13px/1.2 var(--num);background:var(--bg3);color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#3a2700}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px}
.grid span{background:var(--bg3);color:var(--mute);font:500 8px/1 var(--num);aspect-ratio:1;display:grid;place-items:center;border-radius:2px;letter-spacing:-.04em;overflow:hidden}
.grid span.in{background:var(--felt-hi);color:#fff}
.src{font-size:12px;color:var(--mute);margin:0}
.src a{color:var(--blue)}
/* table */
.ask{display:flex;gap:10px;align-items:flex-start}
.ask .av{width:38px;height:38px;border-radius:50%;flex:none;background:linear-gradient(160deg,var(--gold),var(--gold-lo));display:grid;place-items:center;font:400 18px/1 var(--display);color:#3a2700}
.ask p{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;font-weight:600;font-size:15.5px;line-height:1.45;flex:1;min-width:0}
.felt{position:relative;border-radius:46% / 26%;padding:22px 16px 20px;background:radial-gradient(90% 70% at 50% 45%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));border:9px solid var(--rail);box-shadow:0 0 0 1px #2b3b55,inset 0 0 0 2px rgba(245,196,81,.35),inset 0 10px 30px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:12px;min-height:250px;justify-content:space-between}
.felt .who{display:flex;align-items:center;gap:8px}
.felt .av2{width:36px;height:36px;border-radius:50%;background:#26324b;border:2px solid #4a5a7a;display:grid;place-items:center;font-size:12px;color:#cfd8ea;font-weight:700}
.felt .tag{font:600 11px/1 var(--body);background:rgba(0,0,0,.35);color:#e7f4ee;border-radius:99px;padding:5px 9px;white-space:nowrap}
.felt .tag.y{background:var(--gold);color:#3a2700}
.felt .board{display:flex;gap:5px}
.felt .board .cd{--w:44px}
.felt .mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.potline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.amt{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border-radius:99px;padding:3px 10px 3px 3px;font:700 14px/1 var(--num);color:#fff}
.amt .chip{--s:22px;font-size:0}
.amt small{font:500 11px/1 var(--body);color:#cfe3da;margin-right:2px}
.rng{font:700 12.5px/1.45 var(--num);background:rgba(0,0,0,.3);border-radius:10px;padding:7px 10px;color:#fff;text-align:center;max-width:100%}
.rng small{display:block;font:500 11px/1.2 var(--body);color:#bfe0d3;margin-bottom:2px}
.dealer{position:absolute;right:18px;bottom:58px;width:26px;height:26px;border-radius:50%;background:#fff;color:#111;font:700 13px/26px var(--num);text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.posb{font:700 13px/1 var(--num);background:var(--gold);color:#3a2700;border-radius:99px;padding:6px 12px}
/* answers */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border-radius:14px;padding:12px 6px;font-weight:700;font-size:16px;min-height:54px;background:var(--bg2);border:1.5px solid var(--line);box-shadow:0 4px 0 #070b14;transition:transform .08s}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #070b14}
.opt.n{font:700 19px/1 var(--num)}
.opt.a-fold{background:linear-gradient(180deg,#ff7a7e,var(--red));border-color:transparent;color:#fff;box-shadow:0 4px 0 #a5272c}
.opt.a-call{background:linear-gradient(180deg,#5ee3ad,var(--green));border-color:transparent;color:#03281a;box-shadow:0 4px 0 #128559}
.opt.a-raise{background:linear-gradient(180deg,#ffd877,var(--gold));border-color:transparent;color:#3a2700;box-shadow:0 4px 0 var(--gold-lo)}
.opt.bad{opacity:.35;filter:grayscale(.6)}
.opt.ok{outline:3px solid #fff;outline-offset:2px}
.opt:disabled{cursor:default}
/* feedback */
.fb{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg2);border:1px solid var(--line);position:relative;overflow:hidden}
.fb .hd{display:flex;align-items:center;gap:10px;font:400 22px/1 var(--display)}
.fb .hd .chip{--s:34px;font-size:16px}
.fb.good{border-color:rgba(47,208,143,.5);background:linear-gradient(180deg,rgba(47,208,143,.12),var(--bg2) 50%)}
.fb.bad{border-color:rgba(255,93,98,.5);background:linear-gradient(180deg,rgba(255,93,98,.12),var(--bg2) 50%)}
.fb .tx{margin:0;color:#c9d2e6;font-size:14.5px}
.meter{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:62px 1fr 56px;gap:8px;align-items:center;font-size:13px}
.mrow .t{position:relative;height:16px;border-radius:8px;background:var(--bg3)}
.mrow .t span{position:absolute;top:0;bottom:0;border-radius:8px}
.mrow .t .zero{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mute)}
.mrow b{font:700 14px/1 var(--num);text-align:right}
.mrow.best b,.mrow.best{color:var(--green)}
.btn{border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;min-height:50px;background:var(--bg2);border:1.5px solid var(--line)}
.btn.pri{background:linear-gradient(180deg,#ffd877,var(--gold));border-color:transparent;color:#3a2700;box-shadow:0 4px 0 var(--gold-lo);flex:1}
.acts{display:flex;gap:10px}
.burst{position:absolute;right:24px;top:20px;pointer-events:none}
.burst i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);animation:fly .7s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.fb{animation:pop .22s ease-out}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .18s 2}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hud div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mute)}
.hud b{display:block;font:700 22px/1.1 var(--num);color:var(--ink)}
.stepper{display:flex;gap:6px}
.stepper span{flex:1;text-align:center;font-size:12px;padding:6px 4px;border-radius:99px;background:var(--bg3);color:var(--mute);font-weight:700}
.stepper span.on{background:var(--gold);color:#3a2700}.stepper span.dn{background:rgba(47,208,143,.2);color:var(--green)}
.note{font-size:13px;color:var(--mute);margin:0}
/* ref */
.fm{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fm h3{font:400 20px/1.2 var(--display)}
.fm p{margin:0;font-size:14px;color:#c9d2e6}
.tw{overflow-x:auto}
table.ref{border-collapse:collapse;font:500 12.5px/1.3 var(--num);width:100%;min-width:400px}
.ref th,.ref td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.ref th{color:var(--mute);font-weight:500;font-family:var(--body)}
.ref td:first-child{color:var(--gold)}
/* duel table */
.t3{position:relative;height:330px}
.felt3 .board{display:flex;gap:5px}.felt3 .mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.felt3{position:absolute;left:4%;right:4%;top:96px;bottom:0;border-radius:50%/42%;background:radial-gradient(90% 70% at 50% 45%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));border:9px solid var(--rail);box-shadow:0 0 0 1px #2b3b55,inset 0 0 0 2px rgba(245,196,81,.35),inset 0 10px 30px rgba(0,0,0,.35);display:grid;place-items:center}
.felt3 .board .cd{--w:40px}
.st{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .2s}
.st-left{left:0;top:0}.st-right{right:0;top:0}
.me{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:-6px}.me .sc{display:flex;gap:5px}.me .sc .cd{--w:50px}.me .col{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.me.turn .nm{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,208,143,.3)}.me.won .nm{border-color:var(--gold)}
.me .nm{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1.5px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px}.me .nm span:not(.chip){display:flex;flex-direction:column;line-height:1.1}.me .nm b{font-size:12px}.me .nm small{font:700 13px/1.1 var(--num);color:var(--gold)}.me .nm em{font:700 10px/1 var(--num);font-style:normal;background:#fff;color:#111;border-radius:99px;padding:3px 5px}.me .say{font:700 11px/1 var(--body);background:var(--ink);color:var(--bg);border-radius:99px;padding:5px 9px}.me .tag{font:600 11px/1 var(--body);border-radius:99px;padding:4px 8px;background:var(--gold);color:#3a2700}
.me .row-x{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st .sc{display:flex;gap:3px}

 for(const c of cs){const r=c>>2,s=c&3;cnt[r]++;sc[s]++;sm[s]|=1<<r;mask|=1<<r}

{id:'odds',t:'底池赔率',d:'跟注需要多少胜率',h:'底池赔率',body:`<ul><li>跟注需要的胜率 = <span class="k">跟注额 ÷ (跟注后的底池总额)</span>。</li><li>底池 100,对手下注 50:你跟 50,总底池 200,需要 50 ÷ 200 = 25%。</li><li>你的胜率高于需要的胜率就跟,低于就弃。</li><li>常用对照:下注半池需要 25%,三分之二池需要 29%,满池需要 33%。</li><li>转牌跟注后河牌对手可能还要下注,所以听牌在转牌上跟注要更严格。</li><li><b>隐含赔率</b>:现在赔率不够,但中了以后还能多赢 X。需要 <span class="k">X ≥ 跟注额 ÷ 中牌概率 − 跟注后底池</span>。</li></ul><p class="key">每次跟注前先算一个数:我需要多少胜率。</p>`,

{id:'bet',t:'下注',d:'诈唬要多少弃牌率,防守要多宽',h:'从下注方看这笔账',body:`<ul><li><b>诈唬</b>:下注 B 到底池 P,对手弃牌率超过 <span class="k">B ÷ (P + B)</span> 就赚钱。</li><li>半池诈唬只要 33% 弃牌,满池要 50%。</li><li><b>最低防守频率</b>:面对下注,至少要用 <span class="k">P ÷ (P + B)</span> 的手牌继续,否则对手随便诈唬都赚。</li><li><b>价值下注</b>:下注是为了让更差的牌跟注。对手只会用更好的牌跟,就别下注。</li><li><b>河牌诈唬比例</b>:河牌下注 B 到底池 P,下注的牌里诈唬占 <span class="k">B ÷ (P + 2B)</span> 最平衡,对手怎么选都占不到便宜。半池是 1 个诈唬配 3 个价值,满池是 1 配 2。</li><li><b>位置</b>:后说话的人能看到对方的动作再决定,同样的牌在有利位置更赚。</li></ul><p class="key">下注前想清楚:我希望对手弃牌,还是跟注?</p>`,

{id:'range',t:'范围',d:'对手不是一手牌,是一组牌',h:'用范围思考',body:`<ul><li>实战中看不到对手的牌,只能根据他的动作推测他<b>可能拿的一组牌</b>,叫范围。</li><li>用组合数算比例:每种对子 6 种组合,同花 4 种,不同花 12 种。桌上和你手里的牌会减少对手的组合。</li><li><b>阻挡</b>:你手里或桌上有某张牌,对手拿到含这张牌的组合就变少。AK 本来 16 种,桌上和你手里各有一张 K 时只剩 8 种。</li><li>对手范围里全是比你大的牌时,顶对也要弃;范围里有很多听牌和诈唬时,中等牌也能跟。</li><li>前几关能看到对手的牌,是为了练算数。实战里把同样的算数套在范围上。</li></ul><p class="key">问自己:他这样下注,会是哪些牌?</p>`,

{id:'raise',t:'加注',d:'弃、跟、加,比较期望收益',h:'三个选项怎么选',body:`<ul><li>三个选项比的是<b>期望收益(EV)</b>,不是胜率。你的胜率不会因为你加注而改变。</li><li>弃牌:收益记为 <span class="k">0</span>(已经放进去的钱不算)。</li><li>跟注:<span class="k">EV = 胜率 × 跟注后底池 − 跟注额</span>。</li><li>加注:多了一种结果,对手弃牌,你直接拿走底池。<br><span class="k">EV = 弃牌率 × 现有底池 + 跟注率 × (对跟注范围的胜率 × 新底池 − 你投入的钱)</span>。</li><li>对手被加注后,弃掉的是弱牌,跟的是强牌。所以要分开算对“跟注范围”的胜率。</li><li>为了能算清楚,这一关假设:跟注后双方不再下注直接发完;加注就是全下。</li></ul><p class="key">加注的价值 = 对手弃牌的钱 + 被跟时的胜率。两样都没有,就别加。</p>`,

const Cn=(n,k)=>{let r=1;for(let i=0;i<k;i++)r=r*(n-i)/(i+1);return r};

const cds=(str,cls,dimSet,xSet)=>`<span class="row-c">${(typeof str==='string'?cards(str):str).map(c=>cd(c,[cls,dimSet&&dimSet.has(c)?'dim':'',xSet&&xSet.has(c)?'x':''].filter(Boolean).join(' '))).join('')}</span>`;

function donut(parts,center,sub){let a=0;const R=46,C=2*Math.PI*R,tot=parts.reduce((s,p)=>s+p[0],0);
  const segs=parts.map(([v,col])=>{const l=v/tot*C,s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${l-2} ${C-l+2}" stroke-dashoffset="${-a}" transform="rotate(-90 60 60)"/>`;a+=l;return s}).join('');
  return `<svg viewBox="0 0 120 120" width="120" height="120" style="flex:none">${segs}<text x="60" y="62" text-anchor="middle" style="fill:var(--ink);font:700 22px var(--num)">${center}</text><text x="60" y="80" text-anchor="middle" style="fill:var(--mute);font:500 10px var(--body)">${sub||''}</text></svg>`}

function tip(s){if(!s)return s;const keys=Object.keys(TERMS).sort((a,b)=>b.length-a.length);const used=new Set();
  return s.split(/(<[^>]+>)/).map(seg=>{if(seg.startsWith('<'))return seg;
    const re=new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\-]/g,'\\$&')).join('|'),'g');
    return seg.replace(re,m=>{if(used.has(m))return m;used.add(m);return `<button type="button" class="term" data-term="${m}">${m}</button>`})}).join('')}

function texCount(bstr){const B=cards(bstr);let made=0,draw=0,n=0;for(let a=0;a<52;a++)for(let b=a+1;b<52;b++){if(B.includes(a)||B.includes(b))continue;n++;const v=[a,b];
  if(catOf(evalH([...v,...B]))>=1){made++;continue}const all=[...v,...B],sc=[0,0,0,0];all.forEach(c=>sc[c&3]++);if(sc.some(x=>x>=4)){draw++;continue}
  const rs=new Set(all.map(c=>c>>2));let sd=false;for(let r=0;r<13&&!sd;r++){if(rs.has(r))continue;const m=new Set([...rs,r]);for(let h=12;h>=3;h--){let f=true;for(let k=0;k<5;k++){const rr=(h===3&&k===4)?12:h-k;if(!m.has(rr)){f=false;break}}if(f){sd=true;break}}}if(sd)draw++}
  return{made:made/n*100,draw:draw/n*100,air:(n-made-draw)/n*100}}
function texBars(b,lbl){const t=texCount(b);return `<div style="display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center"><span class="row-c">${cards(b).map(c=>cd(c,'sm')).join('')}</span><span class="t" style="height:14px;border-radius:7px;overflow:hidden;display:flex;background:var(--bg3)"><span style="width:${t.made}%;background:var(--red)"></span><span style="width:${t.draw}%;background:var(--gold)"></span><span style="width:${t.air}%;background:#3a465f"></span></span></div><div style="font:600 11.5px/1 var(--num);color:var(--mute);text-align:right">中牌 ${pct(t.made)} · 听牌 ${pct(t.draw)} · 没中 ${pct(t.air)}</div>`}

function rangeCombos(str){return parseRange(str).flatMap(expand)}
function liveCombos(vs,dead){const d=new Set(dead);return vs.filter(v=>!d.has(v[0])&&!d.has(v[1]))}
function buckets(eq){const base=Math.max(5,Math.min(95,Math.round(eq/5)*5));const offs=[[-30,-15,0,15],[-15,0,15,30],[-20,0,15,30],[-30,-15,0,20]][Math.round(eq)%4];
  let v=offs.map(d=>base+d);if(v.some(x=>x<0||x>100))v=(base<50?[0,15,30,45]:[-45,-30,-15,0]).map(d=>base+d);return{opts:v.map(x=>x+'%'),ans:v.indexOf(base)}}
function numOpts(c,cands,fmt,fill,gap){fmt=fmt||pct;gap=gap||4;const r=x=>Math.round(x*10)/10;const out=[r(c)];
  for(const x of [...cands,...(fill||[25,20,40,75,10])]){if(out.length>=4)break;if(x>0&&!out.some(y=>Math.abs(y-r(x))<gap))out.push(r(x))}
  const s=[...out].sort((a,b)=>a-b);return{opts:s.map(fmt),ans:s.indexOf(r(c))}}
function evSpot(H,B,foldStr,callStr,pot,bet,raise){const d=[...H,...B],F=liveCombos(rangeCombos(foldStr),d),C=liveCombos(rangeCombos(callStr),d),all=[...F,...C],f=F.length/all.length;
  const eqAll=equity(H,all,B).eq,eqC=equity(H,C,B).eq;
  return{f,nF:F.length,nC:C.length,eqAll,eqC,ev:[0,eqAll*(pot+2*bet)-bet,f*(pot+bet)+(1-f)*(eqC*(pot+2*raise)-raise)]}}
function setup(pz){const t={pz,picked:[],done:false,show:false,msg:'',mc:''};

  else if(k==='bluff'){const c=pz.bet/(pz.pot+pz.bet)*100;Object.assign(t,numOpts(c,[pz.bet/(pz.pot+2*pz.bet)*100,pz.bet/pz.pot*100,pz.pot/(pz.pot+pz.bet)*100]));t.val=c}

    (G.outs?`<p class="tx">你落后,有 ${G.outs.length} 张 outs,速算 ≈ ${G.outs.length*m}%。</p>${G.outs.length?cds(G.outs,'sm'):''}`:'<p class="tx">你现在领先。</p>'),`<div class="acts"><button class="btn pri" id="nx">下一手 ›</button></div>`)}
  app.innerHTML=h;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.i;if(G.p[i]!=null)return;G.p[i]=j;
    if(i===2){stat.n++;if(j===G.ans){stat.ok++;stat.streak++;stat.best=Math.max(stat.best,stat.streak)}else stat.streak=0;save()}else G.stage=i+1;renderGame();const f=$('#fb');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'})});
  if($('#nx'))$('#nx').onclick=()=>{deal();renderGame();scrollTo(0,0)}}
document.addEventListener('click',ev=>{const b=ev.target.closest('.term');const sh=$('#tsheet');if(b){const t=TERMS[b.dataset.term];if(!t)return;sh.innerHTML=`<div class="tsi"><b>${b.dataset.term}</b><p>${t[0]}</p>${t[1]?`<small>例:${t[1]}</small>`:''}<button class="btn pri" id="tsx">懂了</button></div>`;sh.hidden=false;return}if(sh&&!sh.hidden&&(ev.target===sh||ev.target.id==='tsx'))sh.hidden=true});
$('#hbo').onclick=()=>openHandbook(S.view==='ch'?HB_MAP[CH[S.ch].id]:S.view==='home'?0:HB_MAP[S.view]||0);
$('#back').onclick=()=>{S={view:'home'};T=null;render();scrollTo(0,0)};
render();
// ===== 对战机器人:三人桌 =====
const BL={sb:5,bb:10,stack:1000};
function eqMC(hero,board,nOpp,iters,rng){rng=rng||Math.random;const dead=new Set([...hero,...board]);const deck=[];for(let c=0;c<52;c++)if(!dead.has(c))deck.push(c);
  let s=0;const need=5-board.length,k=need+2*nOpp;
  for(let it=0;it<iters;it++){for(let i=0;i<k;i++){const j=i+(rng()*(deck.length-i)|0);const t=deck[i];deck[i]=deck[j];deck[j]=t}
    const b=board.concat(deck.slice(0,need)),h=evalH(hero.concat(b));let best=0,tie=1;
    for(let o=0;o<nOpp;o++){const v=evalH([deck[need+2*o],deck[need+2*o+1]].concat(b));if(v>h){best=1;break}if(v===h)tie++}
    if(!best)s+=1/tie}
  return s/iters}
let D=null;
function newSession(){D={p:[{name:'你',stack:BL.stack,bot:0},{name:'阿稳',stack:BL.stack,bot:1,style:'tight',tag:'紧手,很少诈唬'},{name:'阿猛',stack:BL.stack,bot:1,style:'loose',tag:'松凶,爱加注'}],dealer:0,hands:0,net:0,log:[],coach:true};newHand()}
function newHand(){const d=D;for(const p of d.p)if(p.stack<=0){p.stack=BL.stack;p.rebuy=(p.rebuy||0)+1;d.log.unshift(`${p.name} 重新买入 ${BL.stack}`)}
  d.dealer=(d.hands===0?Math.random()*3|0:(d.dealer+1)%3);d.hands++;
  const deck=[...Array(52).keys()];for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
  d.deck=deck;d.board=[];d.street=0;d.over=false;d.result=null;d.start=d.p.map(p=>p.stack);d.log=[];
  d.p.forEach((p,i)=>Object.assign(p,{cards:[deck.pop(),deck.pop()],folded:false,allin:false,bet:0,total:0,acted:false,noRaise:false,say:''}));
  const sb=(d.dealer+1)%3,bb=(d.dealer+2)%3;post(sb,BL.sb,'小盲');post(bb,BL.bb,'大盲');
  d.cur=BL.bb;d.minRaise=BL.bb;d.turn=d.dealer;d.p.forEach(p=>p.acted=false);
  d.log.unshift(`第 ${d.hands} 手 · 庄位 ${d.p[d.dealer].name}`);advance(true)}
function post(i,a,why){const p=D.p[i],x=Math.min(a,p.stack);p.stack-=x;p.bet+=x;p.total+=x;if(!p.stack)p.allin=true;p.say=`${why} ${x}`}
const potSize=()=>D.p.reduce((s,p)=>s+p.total,0);
const live=()=>D.p.filter(p=>!p.folded);
const canAct=p=>!p.folded&&!p.allin;
function needsAct(p){return canAct(p)&&(!p.acted||p.bet<D.cur)}
function act(i,type,to){const d=D,p=d.p[i],call=Math.min(d.cur-p.bet,p.stack);
  if(type==='raise'&&(p.noRaise||Math.min(to,p.bet+p.stack)<=d.cur))type=call>0?'call':'check';
  if(type==='fold'){p.folded=true;p.say='弃牌'}
  else if(type==='check'){p.say='过牌'}
  else if(type==='call'){p.stack-=call;p.bet+=call;p.total+=call;if(!p.stack)p.allin=true;p.say=p.allin?`全下 ${p.bet}`:`跟注 ${call}`}
  else if(type==='raise'){to=Math.min(to,p.bet+p.stack);const add=to-p.bet;p.stack-=add;p.total+=add;p.bet=to;if(!p.stack)p.allin=true;
    const full=to-d.cur>=d.minRaise;if(full)d.minRaise=to-d.cur;const wasBet=d.cur===0;d.cur=Math.max(d.cur,to);d.p.forEach((q,j)=>{if(j===i)return;if(full){q.acted=false;q.noRaise=false}else if(q.acted)q.noRaise=true});p.say=p.allin?`全下 ${to}`:wasBet?`下注 ${to}`:`加注到 ${to}`}
  p.acted=true;d.log.unshift(`${p.name}:${p.say}`);advance(false)}
function advance(first){const d=D;
  if(live().length===1)return finish();
  if(!first||true){let idx=null;for(let k=first?0:1;k<=3;k++){const j=(d.turn+k)%3;if(needsAct(d.p[j])){idx=j;break}}
    if(idx!==null&&!(live().filter(canAct).length===1&&d.p[idx].bet>=d.cur)){d.turn=idx;return schedule()}}
  // round over
  d.p.forEach(p=>{p.bet=0;p.acted=false;p.noRaise=false});d.cur=0;d.minRaise=BL.bb;
  if(d.street===3)return finish();
  d.street++;const n=d.street===1?3:1;for(let k=0;k<n;k++)d.board.push(d.deck.pop());
  d.log.unshift(['','翻牌','转牌','河牌'][d.street]+':'+prettyCards(d.board.slice(-n)));
  d.p.forEach(p=>{if(!p.folded)p.say=''});
  if(live().filter(canAct).length<=1){render3();return setTimeout(()=>advance(false),700)}
  d.turn=d.dealer;for(let k=1;k<=3;k++){const j=(d.dealer+k)%3;if(canAct(d.p[j])){d.turn=j;break}}
  schedule()}
function schedule(){render3();const p=D.p[D.turn];if(p.bot){const h=D.hands;setTimeout(()=>{if(D.hands===h&&!D.over)botMove(D.turn)},850)}}
function botMove(i){const d=D,p=d.p[i],opp=live().length-1,eq=eqMC(p.cards,d.board,opp,400),pot=potSize(),toCall=Math.min(d.cur-p.bet,p.stack),need=toCall/(pot+toCall||1);
  const L=p.style==='loose',r=Math.random(),pre=d.street===0;
  const strong=L?.55:.64,ok=L?need-.03:need+.04,bluff=L?.16:.04;
  const raiseTo=f=>{const base=d.cur===0?Math.round(Math.max(BL.bb,pot*f)):d.cur+Math.max(d.minRaise,Math.round((pot+toCall)*f));return Math.min(base,p.bet+p.stack)};
  const adj=pre?eq*(1+.15*(opp-1)):eq;
  if(toCall===0){if(adj>strong||r<bluff)return act(i,'raise',raiseTo(L?.75:.6));return act(i,'check')}
  if(adj>strong+.1&&r<.7)return act(i,'raise',raiseTo(L?.9:.75));
  if(eq>ok||(pre&&toCall<=BL.bb&&eq>.25))return act(i,'call');
  if(r<bluff/2&&p.stack>toCall*3)return act(i,'raise',raiseTo(.8));
  return act(i,'fold')}
function finish(){const d=D;d.over=true;const L=live(),res=[];
  if(L.length===1){const w=L[0];w.stack+=potSize();res.push({w:[w],amt:potSize(),cat:null});d.log.unshift(`${w.name} 赢下 ${potSize()}(其他人弃牌)`)}
  else{while(d.board.length<5)d.board.push(d.deck.pop());
    const sc=new Map(L.map(p=>[p,evalH([...p.cards,...d.board])]));const lv=[...new Set(d.p.map(p=>p.total).filter(x=>x>0))].sort((a,b)=>a-b);let prev=0;
    for(const lvl of lv){const amt=d.p.reduce((s,p)=>s+Math.max(0,Math.min(p.total,lvl)-prev),0);const el=L.filter(p=>p.total>=lvl);
      if(amt>0&&el.length){const top=Math.max(...el.map(p=>sc.get(p))),ws=el.filter(p=>sc.get(p)===top);const share=Math.floor(amt/ws.length);ws.forEach((w,k)=>w.stack+=share+(k<amt-share*ws.length?1:0));
        const last=res[res.length-1];if(last&&last.w.length===ws.length&&last.w.every((x,k)=>x===ws[k]))last.amt+=amt;else res.push({w:ws,amt,cat:CAT[catOf(top)]})}
      else if(amt>0){const p=d.p.find(p=>p.total>=lvl);p.stack+=amt}prev=lvl}
    res.forEach(r=>d.log.unshift(`${r.w.map(x=>x.name).join('、')} 以${r.cat}赢 ${r.amt}`))}
  d.result=res;const delta=d.p[0].stack-d.start[0];d.net+=delta;d.delta=delta;render3()}
function coach(){const d=D,p=d.p[0],opp=live().length-1,eq=eqMC(p.cards,d.board,opp,1500)*100,pot=potSize(),toCall=Math.min(d.cur-p.bet,p.stack),need=toCall?toCall/(pot+toCall)*100:0;
  let tip;if(!toCall)tip=eq>60?'胜率不错,可以下注让更差的牌跟。':eq>35?'中等牌力,过牌看下一张也可以。':'牌力弱,过牌;想诈唬就选对手容易弃的牌面。';
  else tip=eq>need?(eq>65?'胜率明显高于需要,可以考虑加注。':'胜率高于需要,跟注不亏。'):'胜率低于需要,长期看应该弃牌。';
  return{eq,need,tip,opp,toCall}}
const seatPos=['bottom','left','right'];
function seatHTML(i){const d=D,p=d.p[i],isTurn=!d.over&&d.turn===i,show=i===0||(d.over&&!p.folded&&live().length>1);
  const role=[i===d.dealer?'D':'',i===(d.dealer+1)%3?'SB':'',i===(d.dealer+2)%3?'BB':''].filter(Boolean).join(' ');
  const won=d.over&&d.result&&d.result.some(r=>r.w.includes(p));
  const cat=show&&d.board.length>=3?CAT[catOf(evalH([...p.cards,...d.board]))]:'';
  if(i===0)return `<div class="me${isTurn?' turn':''}${won?' won':''}"><div class="sc">${p.cards.map(c=>cd(c)).join('')}</div><div class="col"><div class="nm"><span class="chip" style="--s:28px;font-size:12px">你</span><span><b>你</b><small>${p.stack}</small></span>${role?`<em>${role}</em>`:''}</div><div class="row-x">${p.say?`<span class="say">${p.say}</span>`:''}${cat?`<span class="tag">${cat}</span>`:''}${p.bet?`<span class="amt"><span class="chip"></span>${p.bet}</span>`:''}</div></div></div>`;
  return `<div class="st st-${seatPos[i]}${p.folded?' fold':''}${isTurn?' turn':''}${won?' won':''}">
   <div class="sc">${p.cards.map(c=>show?cd(c,i===0?'md':'sm'):`<span class="cd ${i===0?'md':'sm'} back"></span>`).join('')}</div>
   <div class="nm"><span class="chip ${i===0?'':i===1?'b':'r'}" style="--s:28px;font-size:12px">${i===0?'你':p.name[1]}</span><span><b>${p.name}</b><small>${p.stack}</small></span>${role?`<em>${role}</em>`:''}</div>
   ${p.say?`<span class="say">${p.say}</span>`:''}${cat&&!p.folded?`<span class="tag y">${cat}</span>`:''}${p.bet?`<span class="amt"><span class="chip"></span>${p.bet}</span>`:''}</div>`}
function render3(){if(S.view!=='duel')return;header();$('#ttl').textContent='对战机器人';const d=D,me=d.p[0],myTurn=!d.over&&d.turn===0;
  let h=`<div class="hud"><div>第几手<b>${d.hands}</b></div><div>你的筹码<b>${me.stack}</b></div><div>累计输赢<b style="color:${d.net>=0?'var(--green)':'var(--red)'}">${d.net>=0?'+':''}${d.net}</b></div></div>
  <div class="t3"><div class="felt3"><div class="mid"><div class="board">${d.board.map(c=>cd(c)).join('')}${slots(5-d.board.length)}</div><div class="potline">${amt('底池',potSize())}</div></div></div>${[1,2].map(seatHTML).join('')}</div>${seatHTML(0)}`;
  if(d.over){const r=d.result,win=d.delta>0;h+=`<div class="fb ${win?'good':'bad'}" id="fb">${win?burst():''}<div class="hd"><span class="chip ${win?'g':'r'}">${win?'✓':d.delta<0?'−':'='}</span>${win?'你赢了 +'+d.delta:d.delta<0?'这手输 '+(-d.delta):'这手持平'}</div>`+
    `<p class="tx">${r.map(x=>`${x.w.map(w=>w.name).join('、')}${x.cat?' 以'+x.cat:''}赢 ${x.amt}`).join(';')}</p><div class="acts"><button class="btn pri" id="nh">下一手 ›</button></div></div>`}
  else if(myTurn){const toCall=Math.min(d.cur-me.bet,me.stack),pot=potSize(),max=me.bet+me.stack;
    const raises=[];const mk=(lbl,to)=>{to=Math.min(Math.max(Math.round(to/5)*5,d.cur+d.minRaise,BL.bb),max);if(to>d.cur&&!raises.some(r=>r[1]===to))raises.push([lbl,to])};
    if(d.cur===0){mk('½池',Math.max(BL.bb,pot/2));mk('¾池',Math.max(BL.bb,pot*.75));mk('满池',Math.max(BL.bb,pot))}
    else{mk('最小',d.cur+d.minRaise);mk('¾池',d.cur+(pot+toCall)*.75);mk('满池',d.cur+pot+toCall)}
    if(me.stack>toCall)mk('全下',max);if(me.noRaise)raises.length=0;
    h+=`<div class="acts3"><button class="opt a-fold" data-a="fold">弃牌</button><button class="opt a-call" data-a="${toCall?'call':'check'}">${toCall?(toCall>=me.stack?'全下跟 '+toCall:'跟注 '+toCall):'过牌'}</button></div>`+
      (raises.length?`<div class="rz">${raises.map(([l,v])=>`<button class="opt a-raise" data-a="raise" data-to="${v}"><small>${l}</small>${v===max?'全下 ':d.cur?'加到 ':'下注 '}${v}</button>`).join('')}</div>`:'');
    if(d.coach){const c=coach();h+=`<div class="fb coach"><div class="hd" style="font-size:18px"><span class="chip v" style="--s:28px;font-size:13px">教</span>教练</div><div class="meter">${mrow('你的胜率',c.eq,100,c.toCall&&c.eq<c.need?'var(--red)':'var(--green)',pct(c.eq))}${c.toCall?mrow('需要胜率',c.need,100,'var(--gold)',pct(c.need)):''}</div><p class="tx">${c.tip}</p><p class="note">胜率按 ${c.opp} 个对手拿随机牌估算。对手下注或加注后,他的牌通常比随机牌强,要再打折扣。</p></div>`}}
  else h+=`<p class="note" style="text-align:center">${d.p[d.turn].name} 思考中…</p>`;
  h+=`<div class="log">${d.log.slice(0,6).map(l=>`<span>${l}</span>`).join('')}</div><div class="acts"><button class="btn" id="cz">${d.coach?'关闭教练':'打开教练'}</button><button class="btn" id="rs3">重新开局</button></div>
  <p class="note">盲注 5/10,每人 1000 起。阿稳${d.p[1].tag},阿猛${d.p[2].tag}。机器人按自己的胜率和底池赔率决策,带一点随机。</p>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(D.over||D.turn!==0)return;act(0,b.dataset.a,+b.dataset.to||0)});
  if($('#nh'))$('#nh').onclick=()=>{newHand()};
  $('#cz').onclick=()=>{D.coach=!D.coach;render3()};$('#rs3').onclick=()=>{newSession()}}
</script>
